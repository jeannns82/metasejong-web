<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - METASEJONG</title>

    <!-- Design System -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            800: '#111111',
                            500: '#888888',
                            100: '#f4f4f4',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'scale(1) rotate(0deg)' },
                            '25%': { transform: 'scale(1.015) rotate(-0.5deg)' },
                            '75%': { transform: 'scale(0.985) rotate(0.5deg)' },
                        }
                    },
                    animation: {
                        gradient: 'gradient 15s ease infinite',
                        wiggle: 'wiggle 2s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f4f1ea;
            color: #292d2c;
        }

        #works-list {
            grid-auto-rows: 1fr;
        }

        .work-card-item,
        .work-card {
            height: 100%;
        }

        .work-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #d8d5cd;
            border-radius: 16px;
            background: #faf9f5;
            color: inherit;
            text-decoration: none;
            box-shadow: 0 2px 10px rgba(31, 47, 44, 0.035);
            transition: transform 280ms ease, border-color 280ms ease, box-shadow 280ms ease;
        }

        .work-card:hover {
            transform: translateY(-3px);
            border-color: #aab7b2;
            box-shadow: 0 12px 26px rgba(31, 47, 44, 0.09);
        }

        .work-card-visual {
            aspect-ratio: 16 / 9;
            flex: 0 0 auto;
            overflow: hidden;
            background: #e9e7df;
        }

        .work-card-visual-kcode {
            background: #e8eeeb;
        }

        .work-card-image,
        .work-card-visual-art {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            object-fit: cover;
            transition: transform 450ms cubic-bezier(0.2, 0.65, 0.3, 1);
        }

        .work-card-visual-art {
            background: #e8eeeb;
        }

        .work-card-image-hangul {
            object-position: center 24%;
            transform: scale(1.03);
        }

        .work-card-image-goods {
            object-position: center 50%;
            filter: saturate(.94) contrast(.98);
        }

        .work-card-book-cover {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e6e4dc;
            transition: transform 450ms cubic-bezier(0.2, 0.65, 0.3, 1);
        }

        .work-card-book-lines {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(22, 78, 74, .11) 1px, transparent 1px), linear-gradient(90deg, rgba(22, 78, 74, .11) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: linear-gradient(90deg, transparent 0, #000 30%, #000 100%);
        }

        .work-card-book-image,
        .work-card-book-spine {
            position: absolute;
            top: 50%;
            height: 76%;
            width: auto;
            object-fit: contain;
            box-shadow: 0 15px 28px rgba(42, 47, 44, .2);
        }

        .work-card-book-image {
            right: 20%;
            transform: translateY(-50%) rotate(1deg);
        }

        .work-card-book-spine {
            right: 16%;
            opacity: .38;
            transform: translateY(-50%) rotate(5deg);
        }

        .work-card-book-dot {
            position: absolute;
            border-radius: 999px;
            background: #17605a;
        }

        .work-card-book-dot-one {
            left: 10%;
            bottom: 20%;
            width: 82px;
            height: 82px;
            opacity: .12;
        }

        .work-card-book-dot-two {
            left: 23%;
            top: 17%;
            width: 18px;
            height: 18px;
        }

        .work-card-book-cover::after {
            content: '';
            position: absolute;
            left: 9%;
            top: 30%;
            width: 30%;
            height: 1px;
            background: #17605a;
        }

        .work-card:hover .work-card-image,
        .work-card:hover .work-card-visual-art,
        .work-card:hover .work-card-book-cover {
            transform: scale(1.018);
        }

        .work-card:hover .work-card-image-hangul {
            transform: scale(1.048);
        }

        .work-card-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 260px;
            padding: 28px 30px 30px;
        }

        .work-card-meta {
            display: flex;
            min-height: 22px;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 15px;
        }

        .work-card-label {
            color: #17605a;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            line-height: 1.5;
        }

        .work-card-arrow {
            color: #17605a;
            font-size: 17px;
            line-height: 1;
            transition: transform 280ms ease;
        }

        .work-card:hover .work-card-arrow {
            transform: translate(2px, -2px);
        }

        .work-card-title {
            min-height: 58px;
            margin: 0 0 18px;
            color: #252927;
            font-size: clamp(20px, 1.8vw, 27px);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.28;
            overflow-wrap: anywhere;
        }

        .work-card-description {
            margin: 0;
            color: #424846;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.68;
            word-break: keep-all;
        }

        .work-card-description-en {
            margin-top: 10px;
            color: #626966;
            font-size: 13px;
            line-height: 1.62;
            word-break: normal;
        }

        @media (max-width: 767px) {
            .work-card-book-image {
                right: 17%;
                height: 78%;
            }

            .work-card-book-spine {
                right: 12%;
                height: 78%;
            }

            .work-card-book-dot-one {
                left: 7%;
                bottom: 15%;
                width: 54px;
                height: 54px;
            }

            .work-card-info {
                min-height: 250px;
                padding: 24px 22px 26px;
            }

            .work-card-title {
                min-height: 0;
                margin-bottom: 16px;
                font-size: 21px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/page-intro.css">
</head>

<body>

        <div class="max-w-[1200px] mx-auto px-5 h-[60px] flex items-center justify-between">
            <a href="index.html" class="font-bold text-xl shrink-0"><img src="images/logo.png" alt="METASEJONG"
                    class="h-8 w-auto block"></a>

    <main id="works" class="page-standard relative overflow-hidden">

                <p class="page-intro__label">01 / WORKS</p>

    <!-- Footer -->
    <footer class="py-10 text-center border-t border-gray-100 text-gray-500 text-sm">
