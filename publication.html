<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publication - METASEJONG</title>

    <!-- Design System -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            800: '#111111',
                            500: '#888888',
                            100: '#f4f4f4',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            background: #f4f1ea;
            color: #292d2c;
            font-family: 'Pretendard', sans-serif;
        }

        .publication-page {
            min-height: 100vh;
            padding: 118px 0 80px;
        }

        .publication-container {
            width: min(1120px, calc(100% - 80px));
            margin: 0 auto;
        }

        .publication-kicker,
        .publication-book-label {
            color: #17605a;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2em;
        }

        .publication-kicker {
            margin: 0 0 20px;
        }

        .publication-heading {
            max-width: 1120px;
            margin: 0;
            color: #252927;
            font-size: clamp(34px, 3.3vw, 42px);
            font-weight: 700;
            letter-spacing: -.035em;
            line-height: 1.2;
            word-break: keep-all;
        }

        .publication-subheading {
            max-width: 620px;
            margin: 18px 0 0;
            color: #626966;
            font-size: 15px;
            line-height: 1.7;
        }

        .publication-rule {
            height: 1px;
            margin: 48px 0 56px;
            background: #cfccc4;
        }

        .publication-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .publication-entry {
            display: grid;
            grid-template-columns: minmax(0, 43fr) minmax(0, 57fr);
            gap: 48px;
            align-items: center;
            padding-bottom: 80px;
        }

        .publication-entry + .publication-entry {
            padding-top: 80px;
            border-top: 1px solid #d7d3cb;
        }

        .publication-entry.is-reversed .publication-visual {
            grid-column: 2;
        }

        .publication-entry.is-reversed .publication-info {
            grid-column: 1;
            grid-row: 1;
        }

        .publication-visual {
            display: flex;
            min-height: 540px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #d8d5cd;
            border-radius: 14px;
            background: #ebe9e2;
        }

        .publication-cover-link {
            display: flex;
            width: 100%;
            height: 100%;
            min-height: inherit;
            align-items: center;
            justify-content: center;
        }

        .publication-cover {
            display: block;
            width: auto;
            max-width: 72%;
            height: auto;
            max-height: 430px;
            object-fit: contain;
            filter: drop-shadow(0 16px 20px rgba(38, 43, 40, .14));
            transition: transform 420ms cubic-bezier(.2, .65, .3, 1);
        }

        .publication-entry:hover .publication-cover {
            transform: scale(1.016);
        }

        .publication-book-label {
            margin: 0 0 18px;
        }

        .publication-title-group {
            max-width: 100%;
        }

        .publication-title-main {
            margin: 0;
            color: #252927;
            font-size: clamp(32px, 3.6vw, 49px);
            font-weight: 700;
            letter-spacing: -.05em;
            line-height: 1.12;
            word-break: keep-all;
            overflow-wrap: break-word;
            text-wrap: balance;
        }

        .publication-title-sub {
            max-width: 540px;
            margin: 14px 0 0;
            color: #626966;
            font-size: clamp(20px, 1.8vw, 24px);
            font-weight: 500;
            letter-spacing: -.025em;
            line-height: 1.42;
            word-break: keep-all;
        }

        .publication-summary {
            max-width: 540px;
            margin: 28px 0 0;
            color: #424846;
            font-size: 16px;
            line-height: 1.75;
            word-break: keep-all;
        }

        .publication-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 24px;
            margin: 30px 0 0;
            padding: 22px 0 0;
            border-top: 1px solid #d7d3cb;
        }

        .publication-meta div {
            min-width: 0;
        }

        .publication-meta dt {
            margin: 0 0 4px;
            color: #777d7a;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .publication-meta dd {
            margin: 0;
            color: #444a47;
            font-size: 13px;
            line-height: 1.5;
        }

        .publication-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px 12px;
            margin-top: 24px;
            color: #727875;
            font-size: 11px;
        }

        .publication-link {
            display: inline-flex;
            align-items: center;
            margin-top: 34px;
            color: #17605a;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-decoration: none;
        }

        .publication-link-arrow {
            display: inline-block;
            margin-left: 8px;
            font-size: 15px;
            transition: transform 240ms ease;
        }

        .publication-link:hover .publication-link-arrow {
            transform: translate(3px, -3px);
        }

        @media (max-width: 1023px) {
            .publication-container {
                width: min(1120px, calc(100% - 56px));
            }

            .publication-entry {
                gap: 40px;
            }

            .publication-visual,
            .publication-cover-link {
                min-height: 440px;
            }

            .publication-cover {
                max-height: 350px;
            }

            .publication-title-main {
                font-size: clamp(31px, 3.6vw, 38px);
            }

            .publication-title-sub {
                font-size: clamp(18px, 2.2vw, 22px);
            }
        }

        @media (min-width: 1200px) {
            .publication-heading {
                white-space: nowrap;
            }
        }

        @media (max-width: 767px) {
            .publication-page {
                padding: 102px 0 64px;
            }

            .publication-container {
                width: min(100% - 40px, 1120px);
            }

            .publication-heading {
                font-size: clamp(26px, 8vw, 32px);
            }

            .publication-rule {
                margin: 32px 0 48px;
            }

            .publication-entry,
            .publication-entry.is-reversed {
                grid-template-columns: 1fr;
                gap: 32px;
                padding-bottom: 64px;
            }

            .publication-entry + .publication-entry {
                padding-top: 64px;
            }

            .publication-entry.is-reversed .publication-visual,
            .publication-entry.is-reversed .publication-info {
                grid-column: auto;
                grid-row: auto;
            }

            .publication-visual,
            .publication-cover-link {
                min-height: 420px;
            }

            .publication-cover {
                max-width: 74%;
                max-height: 330px;
            }

            .publication-title-main {
                font-size: clamp(26px, 7.2vw, 31px);
            }

            .publication-title-sub {
                margin-top: 12px;
                font-size: clamp(17px, 5vw, 20px);
                line-height: 1.42;
            }

            .publication-summary {
                margin-top: 24px;
                font-size: 15px;
                line-height: 1.72;
            }

            .publication-meta {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .publication-cover,
            .publication-link-arrow {
                transition: none;
            }
        }
    </style>
    <link rel="stylesheet" href="css/page-intro.css">
    <link rel="stylesheet" href="css/poster-theme.css">
    <link rel="stylesheet" href="css/header-app.css?v=20260803-mobile-nav">
</head>

            <a href="index.html" class="font-bold text-xl shrink-0"><img src="images/logo.png" alt="METASEJONG"
                    class="h-8 w-auto block"></a>
            <nav class="hidden md:block">
                <ul class="flex gap-6">

                    </li>
                    <li><a href="works.html"

                    <li><a href="publication.html"

    <main id="publication" class="publication-page page-standard">

                <p class="page-intro__label">02 / PUBLICATION</p>

    <footer class="py-10 text-center border-t border-gray-100 text-gray-500 text-sm">

    <script src="js/data.js"></script>

</html>
